<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンプル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site detail">
    <nav class="topbar"><a href="index.html">← SET LIST</a><span id="accountLabel"></span></nav>
    <header class="hero detail-hero">
      <p class="eyebrow">SAMPLE SET</p>
      <h1 id="setName"></h1>
      <p id="description" class="lead"></p>
      <div id="stats" class="pills"></div>
    </header>

    <section class="section"><div class="section-heading"><div><p class="eyebrow">PHOTO</p><h2>写真サンプル</h2></div></div><div id="photos" class="media-grid photo-grid"></div></section>
    <section class="section"><div class="section-heading"><div><p class="eyebrow">VIDEO</p><h2>動画サンプル</h2></div></div><div id="videos" class="media-grid video-grid"></div></section>

    <section class="purchase">
      <p class="eyebrow">PURCHASE</p>
      <h2>購入希望はこちら</h2>
      <p>下のボタンで購入希望文をコピーして、Xの <strong id="xHandle"></strong> へDMしてください。</p>
      <div class="message-box" id="messageBox"></div>
      <div class="actions">
        <button id="copyBtn" class="btn primary">購入希望文をコピー</button>
        <a id="xBtn" class="btn xbtn" target="_blank" rel="noopener">Xを開く</a>
      </div>
      <p id="copyStatus" class="status" aria-live="polite"></p>
    </section>

    <div class="notice">※公開サンプルはモザイク・SAMPLE加工済みです。オリジナル／高解像度データはサイト上に掲載していません。</div>
    <footer><a href="index.html">← サンプル一覧へ戻る</a></footer>
  </main>
  <script src="sets.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const index = Number(params.get('set'));
    const set = Number.isInteger(index) && SETS[index] ? SETS[index] : SETS[0];
    const ACCOUNT = X_ACCOUNT.replace(/^@/, '');
    const handle = '@' + ACCOUNT;
    const message = `【${set.name}】の購入を希望します。よろしくお願いします。`;

    document.title = `${set.name} | SAMPLE GALLERY`;
    document.getElementById('setName').textContent = set.name;
    document.getElementById('description').textContent = set.description;
    document.getElementById('accountLabel').textContent = handle;
    document.getElementById('xHandle').textContent = handle;
    document.getElementById('messageBox').textContent = message;
    document.getElementById('stats').innerHTML = `<span>PHOTO ${set.photos}</span><span>VIDEO ${set.videos}</span><span>TOTAL ${set.photos + set.videos}</span>`;
    document.getElementById('xBtn').href = `https://x.com/${encodeURIComponent(ACCOUNT)}`;

    const photos = document.getElementById('photos');
    for (let i = 1; i <= set.photos; i++) {
      const n = String(i).padStart(3, '0');
      const card = document.createElement('div');
      card.className = 'media-card';
      card.innerHTML = `<img loading="lazy" src="samples/${encodeURIComponent(set.folder)}/${encodeURIComponent(set.prefix + '_' + n + '.jpg')}" alt="${escapeHtml(set.name)} photo ${n}">`;
      photos.appendChild(card);
    }

    const videos = document.getElementById('videos');
    for (let i = 1; i <= set.videos; i++) {
      const n = String(i).padStart(3, '0');
      const card = document.createElement('div');
      card.className = 'media-card video-card';
      card.innerHTML = `<video controls preload="metadata" playsinline src="samples/${encodeURIComponent(set.folder)}/${encodeURIComponent(set.prefix + '_' + n + '.mp4')}"></video>`;
      videos.appendChild(card);
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(message);
        document.getElementById('copyStatus').textContent = 'コピーしました。Xを開いてDMに貼り付けてください。';
      } catch (e) {
        const area = document.createElement('textarea');
        area.value = message; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
        document.getElementById('copyStatus').textContent = 'コピーしました。Xを開いてDMに貼り付けてください。';
      }
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
  </script>
</body>
</html>
