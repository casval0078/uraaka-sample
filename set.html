<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMPLE GALLERY</title>
<link rel="stylesheet" href="./style.css">
<script src="./sets.js"></script>
<style>
/* X購入希望ボタン */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 18px;
}
.copybtn,
.xbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 22px;
  border: 1px solid #343a44;
  border-radius: 12px;
  font: inherit;
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  box-sizing: border-box;
  transition: transform .15s ease, filter .15s ease, background .15s ease;
}
.copybtn {
  background: #f3f4f6;
  color: #0d0f12;
}
.xbtn {
  background: #1b1f25;
  color: #fff;
}
.copybtn:hover,
.xbtn:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}
.copybtn:active,
.xbtn:active {
  transform: translateY(0);
}
@media (max-width: 760px) {
  .copybtn,
  .xbtn {
    width: 100%;
  }
}
</style>
</head>
<body>

<header><div class="container nav">
  <div class="logo">SAMPLE GALLERY<small>PUBLIC SAMPLE</small></div>
  <a class="nav-link" href="./index.html">作品一覧</a>
</div></header>

<main id="app"></main>

<footer>SAMPLE GALLERY</footer>

<script>
const params = new URLSearchParams(location.search);
const index = Number(params.get("set"));
const set = SETS[index];

if (!set) {
  document.getElementById("app").innerHTML =
    '<section class="hero"><div class="container"><h1>作品が見つかりません</h1><a class="primary" href="./index.html">一覧へ戻る</a></div></section>';
} else {

  document.title = set.name + "｜SAMPLE GALLERY";

  const app = document.getElementById("app");

  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML =
    '<div class="container">' +
    '<a class="back" href="./index.html">← 作品一覧へ戻る</a>' +
    '<div class="kicker">SAMPLE GALLERY</div>' +
    '<h1>' + set.name + '</h1>' +
    '<p class="hero-text">' + set.description + '</p>' +
    '<div class="stats">' +
    '<span class="stat">PHOTO ' + set.photos + '</span>' +
    '<span class="stat">VIDEO ' + set.videos + '</span>' +
    '<span class="stat">TOTAL ' + (set.photos + set.videos) + '</span>' +
    '</div>' +
    '<a class="primary" href="#purchase">' + set.name + 'を購入したい</a>' +
    '</div>';

  app.appendChild(hero);

  const photoSection = document.createElement("section");
  photoSection.innerHTML =
    '<div class="container"><div class="heading"><h2>PHOTO</h2><p>' +
    set.photos + ' samples</p></div><div class="grid" id="photos"></div></div>';
  app.appendChild(photoSection);

  const photoGrid = photoSection.querySelector("#photos");

  for (let i = 1; i <= set.photos; i++) {
    const number = String(i).padStart(3, "0");
    const file = set.prefix + "_" + number + ".jpg";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<img class="photo" src="./samples/' +
      encodeURIComponent(set.folder) + "/" +
      encodeURIComponent(file) +
      '" alt="' + set.name + ' サンプル写真 ' + i +
      '" loading="lazy"><div class="label">' + file + '</div>';

    photoGrid.appendChild(card);
  }

  const videoSection = document.createElement("section");
  videoSection.innerHTML =
    '<div class="container"><div class="heading"><h2>VIDEO</h2><p>' +
    set.videos +
    ' samples / max 30 sec</p></div><div class="grid" id="videos"></div>' +
    '<div class="notice">このページに掲載しているのは、公開用にモザイク・SAMPLE加工したサンプルのみです。購入用の元データ・高解像度データはこのサイトには掲載していません。</div></div>';

  app.appendChild(videoSection);

  const videoGrid = videoSection.querySelector("#videos");

  for (let i = 1; i <= set.videos; i++) {
    const number = String(i).padStart(3, "0");
    const file = set.prefix + "_" + number + ".mp4";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<video class="video" src="./samples/' +
      encodeURIComponent(set.folder) + "/" +
      encodeURIComponent(file) +
      '" controls preload="metadata" playsinline></video>' +
      '<div class="label">' + file + '</div>';

    videoGrid.appendChild(card);
  }

  const purchaseSection = document.createElement("section");
  purchaseSection.id = "purchase";
  purchaseSection.innerHTML =
    '<div class="container"><div class="purchase">' +
    '<h2>' + set.name + 'を購入する</h2>' +
    '<p>下のボタンで購入希望文をコピーして、Xの @aganeamis2024 へDMしてください。</p>' +
    '<div class="actions">' +
    '<button type="button" class="copybtn" id="copy">定型文をコピー</button>' +
    '<a id="xBtn" class="xbtn" href="https://x.com/aganeamis2024" target="_blank" rel="noopener noreferrer">Xで購入希望を送る</a>' +
    '</div><div class="status" id="status"></div>' +
    '</div></div>';

  app.appendChild(purchaseSection);

  const message =
    "【" + set.name + "】の購入を希望します。よろしくお願いします。";

  document.getElementById("copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(message);
      document.getElementById("status").textContent =
        "定型文をコピーしました。Xを開いてDMに貼り付けてください。";
    } catch (e) {
      const textarea = document.createElement("textarea");
      textarea.value = message;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      document.getElementById("status").textContent =
        "定型文をコピーしました。Xを開いてDMに貼り付けてください。";
    }
  };
}
</script>
</body>
</html>
